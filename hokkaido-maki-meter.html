<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maki Meter">
<meta name="theme-color" content="#14110f">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Hokkaido Maki Meter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: mobile-first, dark izakaya mood. Sumi-black ground, washi text, vermilion hanko accents, gold hairlines, seigaiha waves. One column, sticky round strip (1–10), bottom tab bar, bottom sheets. */
:root{
  color-scheme:dark;
  --bg:#14110f; --paper:#1d1916; --ink:#efe6d6; --muted:#a59b8c; --line:#352e28; --plate:#e9dfcc;
  --sake:#e2472f; --sake-ink:#fff6ec; --sake-soft:#3b1c15;
  --wasabi:#a4c463; --wasabi-soft:#262d18; --nori:#0d0b0a; --gold:#d3a85c; --gold-soft:rgb(211 168 92 / .14);
  --slip:#f1e8d7; --slip-ink:#211b16; --slip-line:#c9bca4;
  --r-2:#e2472f; --r-1:#e98a5c; --r0:#8f877b; --r1:#a4c463; --r2:#6fae3a;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
  --waves:radial-gradient(circle at 50% 100%,transparent 36%,var(--gold-soft) 37% 40%,transparent 41% 56%,var(--gold-soft) 57% 60%,transparent 61% 76%,var(--gold-soft) 77% 80%,transparent 81%);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{background-image:linear-gradient(180deg,rgb(226 71 47/.07),transparent 240px);background-repeat:no-repeat}
.wrap{max-width:640px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sake);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.eyebrow::before{content:"";display:inline-block;width:6px;height:6px;background:var(--sake);margin-right:7px;vertical-align:1px;border-radius:1px}
.h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15}

header.top{padding-block:16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:21px;min-width:0;line-height:1;letter-spacing:.01em}
.hanko{width:40px;height:40px;flex:none;border-radius:6px;background:var(--sake);color:var(--sake-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;line-height:1.05;writing-mode:vertical-rl;letter-spacing:.05em;box-shadow:inset 0 0 0 2px rgb(255 246 236/.35);transform:rotate(-3deg)}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:4px;font-weight:500}
.sync{margin-left:auto;font-size:11px;max-width:88px;line-height:1.25;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--wasabi)} .dot.warn{background:var(--gold)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nori);border-top:1px solid var(--gold-soft);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;border-radius:10px;position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--sake)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--sake);color:var(--sake-ink);font-size:10px;border-radius:999px;padding:0 5px;font-family:var(--f-mono)}

section.view{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;background:var(--line);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--sake);color:var(--sake-ink)}
.btn.dark{background:var(--gold);color:#1a140c}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.danger{background:transparent;border:1px solid var(--sake);color:var(--sake)}
.btn:disabled{opacity:.45;cursor:default}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.in{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;font-weight:400;color:var(--ink)}
textarea.in{min-height:76px;resize:vertical;line-height:1.45}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}

/* dish art */
.art{width:52px;height:52px;flex:none;border-radius:12px;overflow:hidden;display:block;background:var(--plate)}
.art svg,.art img{width:100%;height:100%;display:block;object-fit:cover}
.art.lg{width:100%;height:auto;aspect-ratio:16/10;max-width:100%;border-radius:16px}
.art.lg svg{width:auto;height:100%;margin:0 auto}

/* start */
.hero{background:var(--nori) var(--waves);background-size:44px 22px;border:1px solid var(--gold-soft);color:var(--ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero h2{font-family:var(--f-display);font-size:34px;line-height:1.05;font-weight:800}
.hero p{margin:0;color:var(--muted);max-width:42ch}
.hero .eyebrow{color:var(--gold)}
.hero .seg{background:rgb(255 255 255/.08);border-color:rgb(255 255 255/.16);align-self:flex-start}
.hero .seg button{color:#b9c7c2}
.hero .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero .dots{display:flex;gap:6px}
.hero .dots span{width:22px;height:22px;border-radius:4px;border:1px solid var(--gold);font-family:var(--f-mono);font-size:10px;display:grid;place-items:center;color:var(--gold);background:var(--nori)}

/* live */
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.live .k{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.live .k b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600;line-height:1.1}
.live .k span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.roundstrip{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:8px;margin-block:-8px;display:flex;flex-direction:column;gap:8px}
.rounds{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rounds button{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted);display:grid;place-items:center;position:relative;padding:0;min-width:0}
.rounds button.done{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.rounds button.cur{background:var(--sake);border-color:var(--sake);color:var(--sake-ink);box-shadow:inset 0 0 0 2px rgb(255 246 236/.3)}
.rounds button.view{outline:2px solid var(--ink);outline-offset:2px}
.rounds button:disabled{opacity:.4;cursor:default}
.rounds button small{position:absolute;bottom:-3px;right:-3px;background:var(--ink);color:var(--bg);font-size:9px;border-radius:999px;padding:0 4px;line-height:14px}
.roundhead{display:flex;align-items:center;gap:10px}
.roundhead .rn{font-family:var(--f-display);font-weight:800;font-size:22px}
.search{position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.rf2,.chip.rf1,.chip.rf0,.chip.rf-1,.chip.rf-2{font-family:var(--f-mono);min-width:42px}
.chip.rf2[aria-pressed="true"]{background:var(--r2);border-color:var(--r2);color:var(--paper)} .chip.rf1[aria-pressed="true"]{background:var(--r1);border-color:var(--r1);color:var(--paper)} .chip.rf0[aria-pressed="true"]{background:var(--r0);border-color:var(--r0);color:var(--paper)} .chip.rf-1[aria-pressed="true"]{background:var(--r-1);border-color:var(--r-1);color:var(--paper)} .chip.rf-2[aria-pressed="true"]{background:var(--r-2);border-color:var(--r-2);color:var(--paper)}

.cat h3{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.02em;color:var(--ink);border-bottom:1px solid var(--gold-soft);margin-bottom:6px;padding:6px 2px;display:flex;justify-content:space-between}
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dish{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-top:1px solid var(--line)}
.dish:first-child{border-top:0}
.dish .info{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;gap:12px;align-items:center}
.dish .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.dish .nm{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;line-height:1.25}
.dish .nr{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.dish .ds{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.dish .ds .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.dish.has{background:linear-gradient(90deg,var(--sake-soft),transparent 70%)}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:5px;padding:1px 5px;text-transform:uppercase}
.tag.v{background:var(--wasabi-soft);color:var(--wasabi)}
.tag.s{background:var(--sake-soft);color:var(--sake)}
.mk{color:var(--gold);font-size:13px}
.rb{font-family:var(--f-mono);font-weight:600;font-size:12px;border-radius:6px;padding:0 6px;line-height:18px;color:var(--paper)}
.rb.v-2{background:var(--r-2)} .rb.v-1{background:var(--r-1)} .rb.v0{background:var(--r0)} .rb.v1{background:var(--r1)} .rb.v2{background:var(--r2)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center}
.stepper button.plus{background:var(--sake);color:var(--sake-ink);border-color:var(--sake)}
.stepper .c{min-width:22px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:16px}
.stepper .c.z{color:var(--line)}

.slip{background:var(--slip);color:var(--slip-ink);border:0;border-radius:3px;padding:16px 16px 14px;font-family:var(--f-mono);font-size:14px;box-shadow:0 1px 0 var(--slip-line),0 8px 20px rgb(0 0 0/.35);position:relative}
.slip::before{content:"注文";position:absolute;right:12px;top:-10px;background:var(--sake);color:var(--sake-ink);font-family:var(--f-display);font-weight:800;font-size:11px;padding:3px 6px;border-radius:3px;letter-spacing:.1em}
.slip .hd{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#6b5f50;border-bottom:1px dashed var(--slip-line);padding-bottom:8px;margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase}
.slip ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.slip li{display:flex;gap:10px;align-items:center}
.slip li .q{width:28px;font-weight:600;flex:none}
.slip li .n{flex:1;min-width:0;font-family:var(--f-body)}
.slip li button{width:28px;height:28px;border-radius:50%;border:1px solid var(--slip-line);background:#e6dbc6;color:var(--slip-ink);font-weight:700;line-height:1;flex:none}
.slip .rb{color:var(--slip)}
.slip .empty{color:#6b5f50;font-family:var(--f-body)}

/* rating control */
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 0;font-family:var(--f-mono);font-weight:600;font-size:17px;color:var(--muted);min-width:0}
.rate button small{display:block;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.02em}
.rate button[aria-pressed="true"]{color:var(--paper);border-color:transparent}
.rate button[aria-pressed="true"].v-2{background:var(--r-2)} .rate button[aria-pressed="true"].v-1{background:var(--r-1)} .rate button[aria-pressed="true"].v0{background:var(--r0)} .rate button[aria-pressed="true"].v1{background:var(--r1)} .rate button[aria-pressed="true"].v2{background:var(--r2)}
.rate.sm{gap:4px} .rate.sm button{padding:6px 0;font-size:14px;border-radius:9px}

/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1.1;color:var(--ink)}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14px;align-items:center}
.bar .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar .v{font-family:var(--f-mono);font-weight:600;font-size:13px}
.bar .track{grid-column:1/-1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--sake);border-radius:4px}
.bar.alt .fill{background:var(--wasabi)}
.chart{width:100%;height:auto;display:block}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.dist span{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.vlist{display:flex;flex-direction:column}
.vd{display:flex;gap:10px;align-items:center;padding:7px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.vd:first-child{border-top:0}
.vd .art{width:36px;height:36px;border-radius:9px}
.vd .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px;margin:12px 0 0}
.rec dt{color:var(--muted)} .rec dd{margin:0;font-family:var(--f-mono);font-weight:600;text-align:right}

/* history */
.visit{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.visit>button{width:100%;background:none;border:0;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:center}
.visit .date{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;width:46px;text-align:center;flex:none}
.visit .date small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);margin-top:3px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.visit .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--sake);color:var(--sake-ink)}
.spark{display:flex;gap:2px;align-items:flex-end;height:26px}
.spark span{width:6px;background:var(--wasabi);border-radius:2px 2px 0 0;min-height:2px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mini div{background:var(--bg);border-radius:10px;padding:8px 4px;min-width:0}
.mini b{display:block;font-family:var(--f-mono);font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini span{font-size:11px;color:var(--muted);font-weight:700}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgb(0 0 0/.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-top:1px solid var(--gold-soft);border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet .in-wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.15}
.tg{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.tg[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#241800}
.rrow{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .top{display:flex;gap:10px;align-items:center}
.rrow .top .art{width:40px;height:40px;border-radius:10px}
.rrow .top button.nm{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;font-weight:700}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

.empty-state{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty-state .big{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink)}
.note{font-size:12px;color:var(--muted)}
.banner{background:var(--sake-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
textarea.out{font-family:var(--f-mono);font-size:12px;min-height:140px}
@media (prefers-reduced-motion: no-preference){
  .stepper button:active,.rate button:active{transform:scale(.92)}
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
}

const WQ={};
function persist(id){
  _dm=null;saveLocal();
  if(id==="shared"){if(!DBROOT||!UI.canShare)return}else if(mode!=="db")return;
  const q=WQ[id]||(WQ[id]={});q.pending=true;clearTimeout(q.t);q.t=setTimeout(()=>flush(id),400);

async function write(id){if(id==="shared"){await DBROOT.doc("shared/menu").set(clone(S.shared));return}const d=docData(id);if(d===null)await COLREF.doc(id).delete();else await COLREF.doc(id).set(clone(d))}
async function flush(id){
  const q=WQ[id];if(q.busy){q.dirty=true;return}
  q.busy=true;q.dirty=false;q.t=null;
  try{await write(id);setSync("ok","Gesichert")}
  catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await write(id)}catch(e2){toast("Online-Speichern hat nicht geklappt. Auf dem Gerät ist es gesichert.")}}
    else if(e&&e.code==="invalid_argument"&&id==="shared"){UI.canShare=false;toast("Die gemeinsame Karte darf nur die Besitzerin oder der Besitzer der App ändern.")}
    else if(e&&e.code==="invalid_argument"){goLocal("Du hast hier keine Schreibrechte. Ab jetzt wird nur auf diesem Gerät gespeichert.")}
    else if(e&&e.code==="quota_exceeded")toast("Speicher voll. Lösche alte Fotos oder Besuche.");
    else toast("Online-Speichern hat nicht geklappt. Auf dem Gerät ist es gesichert.");
  }
  q.busy=false;if(q.dirty)flush(id);else q.pending=!!q.t;
}
function goLocal(msg){mode="local";setSync("warn","Nur auf diesem Gerät");if(msg)toast(msg);render()}
const pend=id=>WQ[id]&&(WQ[id].pending||WQ[id].busy);
function applySnap(snap){
  const visits={},photos={};let me=null;
  snap.docs.forEach(d=>{const x=d.data();if(!x)return;if(d.id==="state")me=x;else if(d.id.startsWith("v-"))visits[d.id]=clone(x);else if(d.id.startsWith("ph-")&&x.img)photos[d.id.slice(3)]=x.img});
  if(me&&!pend("state"))S.me=Object.assign({ratings:{},notes:"",nums:{},custom:[],hidden:[],edits:{},unhidden:[]},clone(me));
  const nv={};for(const id in visits)if(!pend(id))nv[id]=visits[id];for(const id in S.visits)if(pend(id))nv[id]=S.visits[id];S.visits=nv;
  const np={};for(const k in photos)if(!pend("ph-"+k))np[k]=photos[k];for(const k in S.photos)if(pend("ph-"+k))np[k]=S.photos[k];S.photos=np;
  _dm=null;saveLocal();scheduleRender();

async function boot(){
  loadLocal();route();
  if(!window.claude||!window.claude.use){setSync("warn","Nur auf diesem Gerät");return}
  try{
    const [db,user,dl,sm]=await Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("downloads"),window.claude.use("sample")]);
    DL=dl;SAMPLE=sm;
    if(user){try{UI.canShare=!!(await user.canEdit())}catch(e){}}
    if(db){DBROOT=db;db.doc("shared/menu").onSnapshot(sn=>{if(pend("shared"))return;const x=sn.exists?sn.data():null;S.shared=Object.assign(emptyShared(),x?clone(x):{});_dm=null;saveLocal();scheduleRender()},()=>{})}
    const uid=user?await user.id():null;
    const can=user?await user.can("data.write"):null;
    if(!db||!uid||can===false){setSync("warn","Nur auf diesem Gerät");render();return}
    COLREF=db.collection("data/users/"+uid);mode="db";
    setSync("","Verbinde …");
    const timer=setTimeout(()=>setSync("warn","Noch keine Verbindung"),10000);
    let first=true;
    COLREF.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer);setSync("ok","Gesichert")}
      if(first&&!snap.metadata.fromCache){first=false;
        const hasLocal=Object.keys(S.visits).length||Object.keys(S.me.ratings||{}).length;
        if(snap.empty&&hasLocal){Object.keys(S.visits).forEach(persist);persist("state");Object.keys(S.photos).forEach(k=>persist("ph-"+k));return}
      }
      applySnap(snap);
    },()=>{clearTimeout(timer);goLocal()});
    render();
  }catch(e){setSync("warn","Nur auf diesem Gerät")}
}

/* --- Statistik --- */
function monthChart(vs){
  const now=new Date(),months=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:d.getFullYear()+"-"+d.getMonth(),l:d.toLocaleDateString("de-DE",{month:"narrow"}),n:0})}
  vs.forEach(v=>{const d=new Date(v.start);const m=months.find(x=>x.k===d.getFullYear()+"-"+d.getMonth());if(m)m.n++});
  return barChart(months.map(m=>({l:m.l,n:m.n})),"Besuche pro Monat, letzte 12 Monate",11,0);
}
function barChart(items,label,hi,decimals){
  const max=Math.max(1,...items.map(m=>m.n)),W=340,H=130,pad=22,bw=(W-pad-4)/items.length;
  const top=decimals?Math.ceil(max):max;
  const ticks=top<=4&&!decimals?Array.from({length:top+1},(_,i)=>i):[0,top/2,top];
  const fmt=x=>decimals?dec(x,x%1?1:0):String(Math.round(x));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(label)}">
    ${ticks.map(t=>{const y=H-20-(t/top)*(H-40);return `<line x1="${pad}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(t)}</text>`}).join("")}
    ${items.map((m,i)=>{const bh=(m.n/top)*(H-40),x=pad+i*bw+3,w=bw-6;return `<rect x="${x}" y="${H-20-bh}" width="${w}" height="${bh}" rx="3" fill="${i===hi?"var(--sake)":"var(--wasabi)"}"/><text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${m.l}</text>${m.n?`<text x="${x+w/2}" y="${H-24-bh}" text-anchor="middle" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${decimals?dec(m.n):m.n}</text>`:""}`}).join("")}
  </svg>`;
}
function computeStats(){
  const vs=periodVisits(),ao=vs.flatMap(vOrders),counts={};ao.forEach(o=>counts[o.d]=(counts[o.d]||0)+1);
  const done=vs.filter(v=>v.end&&!v.active);
  const perRound=Array.from({length:MAXR},(_,i)=>{const r=i+1;const vv=vs.filter(v=>roundCount(v)>=r);const n=vv.reduce((s,v)=>s+((v.rounds||{})[r]||[]).length,0);return {l:String(r),n:vv.length?n/vv.length:0}});
  const rated=menu().filter(d=>hasR(d.id));
  const dist={};RATE.forEach(([v])=>dist[v]=0);rated.forEach(d=>dist[rt(d.id).r]++);
  const visitsWith={};vs.forEach(v=>new Set(vOrders(v).map(o=>o.d)).forEach(d=>visitsWith[d]=(visitsWith[d]||0)+1));
  return {vs,ao,counts,done,perRound,rated,dist,visitsWith};
}
function viewStats(){
  const st=computeStats(),vs=st.vs;
  const dl=`<div class="card"><div class="eyebrow">Herunterladen</div><p class="note" style="margin:6px 0 10px">Deine Daten als Tabelle für Excel/Numbers oder als komplettes Backup, das du hier wieder laden kannst.</p>
    <div class="row"><button class="btn small primary" data-act="dl-stats">Statistik (CSV)</button><button class="btn small ghost" data-act="dl-orders">Alle Bestellungen (CSV)</button><button class="btn small ghost" data-act="dl-backup">Backup (JSON)</button>
    <span class="btn small ghost filebtn">Backup laden<input type="file" id="importfile" accept=".json,application/json" aria-label="Backup laden"></span></div>
    ${mode==="local"?`<p class="note" style="margin:10px 0 0">Gespeichert nur auf diesem Gerät. Lade ab und zu ein Backup herunter.</p>`:""}</div>`;
  const allV=visitsSorted();
  const head=`<div><h2 class="h2">All-Time</h2><div class="note">Alles über deine Hokkaido-Besuche${allV.length?` seit ${h(dLong(allV[allV.length-1].start))}`:""}.</div></div>
    <div class="seg" role="group" aria-label="Zeitraum">${PERIODS.map(([k,n])=>`<button data-act="period" data-v="${k}" aria-pressed="${UI.period===k}">${n}</button>`).join("")}</div>`;
  if(!vs.length&&allV.length)return `<section class="view">${head}<div class="card empty-state"><span class="big">Keine Besuche in diesem Zeitraum</span>Wähle oben einen längeren Zeitraum.</div>${dl}</section>`;
  if(!vs.length)return `<section class="view">${head}<div class="card empty-state"><span class="big">Noch keine Statistik</span>Nach deinem ersten Essen siehst du hier deine Top-Gerichte, wie viel du pro Runde schaffst, deine Bewertungen und Rekorde.<a class="btn primary" href="#heute" style="margin-top:6px">Essen starten</a></div>${dl}</section>`;
  const tot=st.ao.length,avg=tot/vs.length,avgR=vs.reduce((s,v)=>s+roundCount(v),0)/vs.length;
  const top=Object.entries(st.counts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const most=vs.reduce((m,v)=>{const n=vOrders(v).length;return !m||n>m.n?{v,n}:m},null);
  const longest=st.done.reduce((m,v)=>!m||(v.end-v.start)>(m.end-m.start)?v:m,null);
  const maxR=Math.max(...vs.map(roundCount));
  const avgDur=st.done.length?st.done.reduce((s,v)=>s+(v.end-v.start),0)/st.done.length:0;
  const catCount={};st.ao.forEach(o=>{const c=dish(o.d).c;catCount[c]=(catCount[c]||0)+1});const catMax=Math.max(1,...Object.values(catCount));
  const best=st.rated.filter(d=>rt(d.id).r===2).sort((a,b)=>(st.counts[b.id]||0)-(st.counts[a.id]||0));
  const worst=st.rated.filter(d=>rt(d.id).r<0).sort((a,b)=>rt(a.id).r-rt(b.id).r);
  const unrated=menu().filter(d=>st.counts[d.id]&&!hasR(d.id));
  const rcol={"-2":"var(--r-2)","-1":"var(--r-1)","0":"var(--r0)","1":"var(--r1)","2":"var(--r2)"};
  const lastR=st.perRound.map((x,i)=>x.n?i:-1).filter(i=>i>=0).pop();
  const fav=top[0]?dish(top[0][0]):null;
  const favCat=Object.entries(catCount).sort((a,b)=>b[1]-a[1])[0];
  const totalTime=st.done.reduce((s2,v)=>s2+(v.end-v.start),0);
  const totalRounds=vs.reduce((s2,v)=>s2+roundCount(v),0);
  const first=vs[vs.length-1];
  return `<section class="view">
    ${head}
    ${fav?`<div class="card" style="display:flex;gap:14px;align-items:center;background:var(--nori);border-color:var(--nori);color:#eef3f1">${art(fav)}<div class="grow"><div class="eyebrow" style="color:#b9c7c2">${UI.period==="all"?"Dein Lieblingsgericht aller Zeiten":"Dein Lieblingsgericht im Zeitraum"}</div><div style="font-family:var(--f-display);font-size:20px;line-height:1.15;margin-top:2px">${h(fav.n)}</div><div style="font-size:13px;color:#b9c7c2">${top[0][1]}× gegessen in ${st.visitsWith[fav.id]||0} von ${vs.length} Besuchen</div></div></div>`:""}
    <div class="kpis">
      <div class="kpi"><b class="num">${vs.length}</b><span>Besuche</span></div>
      <div class="kpi"><b class="num">${tot}</b><span>Portionen gesamt</span></div>
      <div class="kpi"><b class="num">${dec(avg)}</b><span>Ø Portionen pro Besuch</span></div>
      <div class="kpi"><b class="num">${dec(avgR)}</b><span>Ø Runden pro Besuch</span></div>
    </div>
    <div class="card"><div class="eyebrow">Ø Portionen pro Runde</div><p class="note" style="margin:4px 0 6px">Wie schnell du nachlässt. Gezählt nur Besuche, die diese Runde erreicht haben.</p>${barChart(st.perRound.slice(0,Math.max(3,(lastR??0)+1)),"Durchschnittliche Portionen je Runde",-1,1)}</div>
    <div class="card"><div class="eyebrow">Am häufigsten gegessen</div><div class="vlist" style="margin-top:6px">${top.map(([id,n])=>`<button class="vd" data-act="dish" data-id="${id}">${art(dish(id))}<span class="nm">${h(dish(id).n)}</span>${rbadge(id)}<span class="num" style="font-weight:600">${n}×</span></button>`).join("")}</div></div>
    <div class="card"><div class="eyebrow">Deine Bewertungen</div>
      ${st.rated.length?`<div class="dist" style="margin-top:12px" role="img" aria-label="Verteilung der Bewertungen">${RATE.map(([v])=>st.dist[v]?`<span style="width:${st.dist[v]/st.rated.length*100}%;background:${rcol[v]}"></span>`:"").join("")}</div>
      <div class="legend">${RATE.map(([v,s])=>`<span><i style="background:${rcol[v]}"></i>${s} <b class="num">${st.dist[v]}</b></span>`).join("")}</div>`:`<p class="note">Noch nichts bewertet.</p>`}
      ${best.length?`<div class="eyebrow" style="margin-top:16px">Deine ++</div><div class="vlist">${best.slice(0,8).map(d=>`<button class="vd" data-act="dish" data-id="${d.id}">${art(d)}<span class="nm">${h(d.n)}</span><span class="num note">${st.counts[d.id]||0}×</span></button>`).join("")}</div>`:""}
      ${worst.length?`<div class="eyebrow" style="margin-top:16px">Lieber nicht mehr</div><div class="vlist">${worst.slice(0,8).map(d=>`<button class="vd" data-act="dish" data-id="${d.id}">${art(d)}<span class="nm">${h(d.n)}</span>${rbadge(d.id)}</button>`).join("")}</div>`:""}
      ${unrated.length?`<p class="note" style="margin:12px 0 0">${unrated.length} gegessene Gerichte sind noch unbewertet. <a href="#karte" data-act="kfopen">Jetzt bewerten</a></p>`:""}
    </div>
    <div class="card"><div class="eyebrow">Besuche pro Monat</div><div style="margin-top:8px">${monthChart(vs)}</div></div>
    <div class="card"><div class="eyebrow">Rekorde</div><dl class="rec">
      ${most&&most.n?`<dt>Meiste Portionen</dt><dd>${most.n} · ${dShort(most.v.start)}</dd>`:""}
      <dt>Meiste Runden</dt><dd>${maxR}/${MAXR}</dd>
      ${longest?`<dt>Längstes Essen</dt><dd>${fmtDur(longest.end-longest.start)}</dd>`:""}
      ${avgDur?`<dt>Ø Dauer</dt><dd>${fmtDur(avgDur)}</dd>`:""}
      <dt>Runden insgesamt</dt><dd>${totalRounds}</dd>
      ${totalTime?`<dt>Zeit am Tisch insgesamt</dt><dd>${fmtDur(totalTime)}</dd>`:""}
      ${favCat?`<dt>Lieblingskategorie</dt><dd>${h(catName(favCat[0]))}</dd>`:""}
      ${first?`<dt>Erster Besuch im Zeitraum</dt><dd>${dShort(first.start)}</dd>`:""}
      <dt>Verschiedene Gerichte</dt><dd>${Object.keys(st.counts).length}</dd>
      <dt>Karte probiert</dt><dd>${menu().filter(d=>st.counts[d.id]).length}/${menu().length}</dd>
    </dl></div>
    ${tot?`<div class="card"><div class="eyebrow">Was du bestellst</div><div class="bars" style="margin-top:12px">
      ${CATS.filter(([c])=>catCount[c]).sort((a,b)=>catCount[b[0]]-catCount[a[0]]).map(([c,n])=>`<div class="bar alt"><span class="t">${h(n)}</span><span class="v">${catCount[c]} · ${Math.round(catCount[c]/tot*100)}%</span><div class="track"><div class="fill" style="width:${catCount[c]/catMax*100}%"></div></div></div>`).join("")}
    </div></div>`:""}
    ${dl}
  </section>`;
}

/* --- Verlauf --- */
function viewVerlauf(){
  const vs=visitsSorted();
  if(!vs.length)return `<section class="view"><div class="card empty-state"><span class="big">Noch keine Besuche</span>Jedes Essen landet hier mit allen Runden und deinen Notizen.<a class="btn primary" href="#heute" style="margin-top:6px">Essen starten</a></div>${notesCard()}</section>`;
  return `<section class="view"><h2 class="h2">Verlauf <span class="num note" style="font-size:14px">${vs.length}</span></h2>
  ${vs.map(v=>{const d=new Date(v.start),open=UI.open===v.id,os=vOrders(v),rc=roundCount(v);
    const per=Array.from({length:Math.max(rc,1)},(_,i)=>((v.rounds||{})[i+1]||[]).length),pm=Math.max(1,...per);
    return `<div class="visit"><button data-act="toggle" data-id="${v.id}" aria-expanded="${open}">
      <span class="date">${d.getDate()}<small>${d.toLocaleDateString("de-DE",{month:"short"}).replace(".","")}</small></span>
      <span class="grow"><b>${h(d.toLocaleDateString("de-DE",{weekday:"long"}))}${v.mode?` · ${h(v.mode[0].toUpperCase()+v.mode.slice(1))}`:""}</b><br><span class="note">${os.length} Portionen · ${rc} Runden${v.note?" · Notiz":""}</span></span>
      ${v.active?'<span class="pill">läuft</span>':`<span class="spark" aria-hidden="true">${per.map(n=>`<span style="height:${n/pm*100}%"></span>`).join("")}</span>`}
    </button>
    ${open?`<div class="body">
      <div class="mini"><div><b>${v.active?fmtDur(Date.now()-v.start):fmtDur((v.end||v.start)-v.start)}</b><span>Dauer</span></div><div><b>${os.length}</b><span>Portionen</span></div><div><b>${rc}</b><span>Runden</span></div></div>
      ${Array.from({length:rc},(_,i)=>i+1).map(r=>{const o=(v.rounds||{})[r]||[];if(!o.length)return"";const g={};o.forEach(x=>g[x.d]=(g[x.d]||0)+1);return `<div class="slip"><div class="hd"><span>Runde ${r}</span><span>${o.length} Port.</span></div><ol>${Object.entries(g).map(([id,q])=>`<li><span class="q">${q}×</span><span class="n">${h(dish(id).n)}</span>${rbadge(id)}</li>`).join("")}</ol></div>`}).join("")||'<span class="note">Keine Bestellungen.</span>'}
      <label class="f">Notiz zu diesem Essen<textarea class="in" id="vn-${v.id}" data-in="vnote" data-id="${v.id}" placeholder="Wer war dabei, Anlass, Service …">${h(v.note||"")}</textarea></label>
      <div class="row"><button class="btn small primary" data-act="ratevisit" data-id="${v.id}">Gerichte bewerten</button>
      ${UI.confirmDel===v.id?`<span class="confirm"><span>Wirklich löschen?</span><button class="btn small danger" data-act="del" data-id="${v.id}">Löschen</button><button class="btn small ghost" data-act="nodel">Abbrechen</button></span>`:`<button class="btn small ghost" data-act="askdel" data-id="${v.id}">Löschen</button>`}</div>
    </div>`:""}</div>`}).join("")}
    ${notesCard()}
  </section>`;
}

/* ---------- Export / Import ---------- */
const csvCell=x=>{const s=String(x??"");return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>"﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n");
const today=()=>new Date().toISOString().slice(0,10);
function catName(c){return (CATS.find(x=>x[0]===c)||[,c])[1]}
function statsCSV(){
  const st=computeStats(),rows=[["Gericht","Nr.","Kategorie","Anzahl gegessen","Besuche mit diesem Gericht","Zuletzt","Bewertung","Merkliste","Notiz"]];
  const last={};st.ao.forEach(o=>{if(!last[o.d]||o.t>last[o.d])last[o.d]=o.t});
  allDishes().filter(d=>st.counts[d.id]||hasR(d.id)||rt(d.id).mark||rt(d.id).note).sort((a,b)=>(st.counts[b.id]||0)-(st.counts[a.id]||0)).forEach(d=>{const r=rt(d.id);rows.push([d.n,nr(d.id),catName(d.c),st.counts[d.id]||0,st.visitsWith[d.id]||0,last[d.id]?new Date(last[d.id]).toLocaleDateString("de-DE"):"",hasR(d.id)?RLAB[r.r]:"",r.mark?"ja":"",r.note||""])});
  rows.push([]);rows.push(["Zusammenfassung"]);
  rows.push(["Besuche",st.vs.length]);rows.push(["Portionen gesamt",st.ao.length]);
  rows.push(["Ø Portionen pro Besuch",st.vs.length?dec(st.ao.length/st.vs.length):""]);
  rows.push(["Ø Runden pro Besuch",st.vs.length?dec(st.vs.reduce((s,v)=>s+roundCount(v),0)/st.vs.length):""]);
  st.perRound.forEach((x,i)=>{if(x.n)rows.push(["Ø Portionen in Runde "+(i+1),dec(x.n)])});
  rows.push([]);rows.push(["Besuch","Tageszeit","Dauer (min)","Runden","Portionen","Notiz"]);
  st.vs.slice().reverse().forEach(v=>rows.push([new Date(v.start).toLocaleString("de-DE"),v.mode||"",v.end?Math.round((v.end-v.start)/60000):"",roundCount(v),vOrders(v).length,v.note||""]));
  return toCSV(rows);
}
function ordersCSV(){
  const rows=[["Datum","Uhrzeit","Runde","Nr.","Gericht","Kategorie","Bewertung","Notiz zum Gericht"]];
  visitsSorted().slice().reverse().forEach(v=>vOrders(v).forEach(o=>{const d=dish(o.d),r=rt(o.d),t=new Date(o.t);rows.push([t.toLocaleDateString("de-DE"),t.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),o.r,nr(o.d),d.n,catName(d.c),hasR(o.d)?RLAB[r.r]:"",r.note||""])}));
  return toCSV(rows);
}
async function offer(filename,data,title){
  if(!window.claude){try{const type=filename.endsWith(".json")?"application/json":"text/csv";const url=URL.createObjectURL(new Blob([data],{type:type+";charset=utf-8"}));const el=document.createElement("a");el.href=url;el.download=filename;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Download gestartet");return}catch(e){}}
  if(DL){try{await DL.save({filename,data});toast("Gespeichert");return}catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("Einen Moment, dann nochmal.");return}}}
  SHEET={type:"text",title,text:data};renderOverlay();
}
function importBackup(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const x=JSON.parse(fr.result);if(!x||x.app!=="hokkaido-strichliste")throw 0;
    let nv=0;Object.values(x.visits||{}).forEach(v=>{if(v&&v.id&&!S.visits[v.id]){S.visits[v.id]=v;persist(v.id);nv++}});
    const me=x.me||{};S.me.ratings=Object.assign({},me.ratings||{},S.me.ratings);S.me.nums=Object.assign({},me.nums||{},S.me.nums);
    const ids=new Set((S.me.custom||[]).map(c=>c.id));S.me.custom=(S.me.custom||[]).concat((me.custom||[]).filter(c=>!ids.has(c.id)));
    S.me.hidden=[...new Set([...(S.me.hidden||[]),...(me.hidden||[])])];if(me.notes&&!String(S.me.notes||"").includes(me.notes))S.me.notes=(S.me.notes?S.me.notes+"\n\n":"")+me.notes;
    persist("state");Object.entries(x.photos||{}).forEach(([k,p])=>{if(!S.photos[k]){S.photos[k]=p;persist("ph-"+k)}});
    render();toast(`Backup geladen: ${nv} Besuche ergänzt`);
  }catch(e){toast("Diese Datei ist kein Backup vom Hokkaido Maki Meter.")}};
  fr.readAsText(file);
}
function photoFrom(file,did){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{const m=480,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=.75,url=c.toDataURL("image/jpeg",q);while(url.length>120000&&q>.35){q-=.1;url=c.toDataURL("image/jpeg",q)}
    S.photos[did]=url;persist("ph-"+did);render();toast("Foto gespeichert")};img.onerror=()=>toast("Das Bild konnte nicht gelesen werden.");img.src=fr.result};
  fr.readAsDataURL(file);
}

/* ---------- Menu editing & import ---------- */
function saveEdit(id,f,num,share){
  const T=share?S.shared:S.me;
  const ci=(T.custom||[]).findIndex(x=>x.id===id);
  if(ci>=0){T.custom=T.custom.slice();T.custom[ci]=Object.assign({},T.custom[ci],f)}else T.edits=Object.assign({},T.edits,{[id]:f});
  T.nums=Object.assign({},T.nums);if(num)T.nums[id]=num;else delete T.nums[id];
  if(share){S.me.edits=Object.assign({},S.me.edits);delete S.me.edits[id];S.me.nums=Object.assign({},S.me.nums);delete S.me.nums[id];S.shared.updated=Date.now();persist("shared")}
  persist("state");
}
const toks=s=>slug(s).split("-").filter(Boolean);
function nameScore(a,b){const A=toks(a),B=new Set(toks(b));if(!A.length||!B.size)return 0;if(A.join("")===[...B].join(""))return 1;let i=0;A.forEach(x=>{if(B.has(x))i++});return i/Math.max(A.length,B.size)}
function matchRows(rows){
  const pool=allDishes(),used=new Set();
  return rows.map(r=>{let best=null,bs=0;pool.forEach(d=>{if(used.has(d.id))return;let sc=nameScore(r.name,d.n);if(sc>0&&r.cat&&r.cat===d.c)sc+=.08;if(sc>bs){bs=sc;best=d}});
    const m=bs>=.66?best.id:null;if(m)used.add(m);return Object.assign({on:true,match:m},r)});
}
function parseLines(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(l=>l.length>2).map(l=>{const m=l.match(/^(\d{1,3}[a-zA-Z]?)[\s.):\-]+(.+)$/);let nrv="",rest=l;if(m){nrv=m[1];rest=m[2]}
    const parts=rest.split(/\s[–-]\s|:\s|,\s(?=[a-zäöü])/);const name=parts[0].replace(/\s*\d+[.,]\d{2}\s*€?$/,"").trim();
    return {nr:nrv,name,cat:"eigene",desc:parts.slice(1).join(", ").trim(),v:/vegan|vegetar/i.test(l),s:/scharf|spicy/i.test(l)}}).filter(r=>r.name);
}
function resizeToBlob(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res({blob:b,url:c.toDataURL("image/jpeg",.5)}):rej(),"image/jpeg",.85)};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function impRead(){
  const sh=SHEET,text=(sh.text||"").trim(),imgs=(sh.imgs||[]).map(x=>x.blob);
  if(!text&&!imgs.length){sh.err=SAMPLE?"Wähle Fotos der Karte oder füge den Text ein.":"Füge zuerst den Text der Karte ein.";renderOverlay();return}
  sh.err=null;
  if(!SAMPLE||(!imgs.length&&/^\s*\d/m.test(text)&&text.split(/\n/).length>3)){const rows=matchRows(parseLines(text));if(rows.length){sh.rows=rows}else sh.err="Ich konnte keine Gerichte erkennen. Schreib ein Gericht pro Zeile.";renderOverlay();return}
  sh.busy="Claude liest die Karte. Das dauert meist 20 bis 60 Sekunden.";renderOverlay();
  try{
    const prompt=`Du liest die All-you-can-eat-Speisekarte des japanischen Restaurants Hokkaido Sushi & Grill in Bonn. Erfasse ALLE Speisen (keine Getränke, keine Preise, keine Regeln).
Antworte nur mit einem JSON-Array. Jedes Element: {"nr": Bestellnummer als Text oder "", "name": Name, "cat": eine von ${CATS.map(c=>'"'+c[0]+'"').join(",")} (vor=Vorspeisen, sal=Salate, warm=warme Gerichte, io=Inside-Out-Rollen, gunkan=Gunkan und Inari, sashimi=Sashimi und Tataki, wok=gebratener Reis und Nudeln), "desc": Zutaten kurz auf Deutsch, "veg": true/false, "spicy": true/false}.
Beispiel: [{"nr":"54","name":"Alaska Roll","cat":"io","desc":"Lachs, Avocado","veg":false,"spicy":false}]
Wenn ein Gericht einem dieser bekannten Namen entspricht, verwende genau diese Schreibweise: ${BASE.map(d=>d.n).join(", ")}.`+(text?`\n\nText der Karte:\n${text}`:"");
    const res=await SAMPLE.json(prompt,imgs.length?{images:imgs}:{});
    if(SHEET!==sh)return;
    const arr=Array.isArray(res)?res:(res&&(res.dishes||res.gerichte))||[];
    const rows=matchRows(arr.filter(x=>x&&x.name).map(x=>({nr:String(x.nr??"").trim(),name:String(x.name).trim(),cat:CATS.some(c=>c[0]===x.cat)?x.cat:"eigene",desc:String(x.desc||"").trim(),v:!!x.veg,s:!!x.spicy})));
    if(rows.length)sh.rows=rows;else sh.err="Auf den Fotos habe ich keine Gerichte gefunden. Versuch es mit schärferen, geraden Fotos.";
  }catch(e){
    if(SHEET!==sh)return;
    sh.err={not_granted:"Du hast den Zugriff auf Claude nicht erlaubt. Füge stattdessen den Text der Karte ein.",rate_limited:"Gerade zu viele Anfragen. Versuch es in einer Minute nochmal.",images_unavailable:"Fotos können hier nicht ausgelesen werden. Füge den Text der Karte ein.",cancelled:"Abgebrochen."}[e&&e.code]||"Das Auslesen hat nicht geklappt. Versuch es nochmal oder füge den Text ein.";
    if(text){const rows=matchRows(parseLines(text));if(rows.length){sh.rows=rows;sh.err=null}}
  }
  sh.busy=null;renderOverlay();
}
function impApply(){
  const share=UI.canShare&&!!(document.getElementById("imp-share")||{}).checked,hide=!!(document.getElementById("imp-hide")||{}).checked;
  const T=share?S.shared:S.me;T.nums=Object.assign({},T.nums);T.custom=(T.custom||[]).slice();
  const keep=new Set();let added=0,nums=0;
  SHEET.rows.filter(r=>r.on).forEach(r=>{let id=r.match;if(!id){id="x-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);T.custom.push({id,c:r.cat,n:r.name,d:r.desc,v:r.v,s:r.s});added++}keep.add(id);if(r.nr){T.nums[id]=r.nr;nums++}});
  T.hidden=(T.hidden||[]).filter(id=>!keep.has(id));
  if(hide)T.hidden=[...new Set([...T.hidden,...allDishes().filter(d=>!keep.has(d.id)).map(d=>d.id)])];
  if(share){S.shared.updated=Date.now();persist("shared")}else persist("state");
  SHEET=null;render();toast(`Übernommen: ${nums} Nummern, ${added} neue Gerichte${share?" für alle":""}`);
}

/* ---------- Actions ---------- */
function setR(did,patch){
  const ratings=Object.assign({},S.me.ratings||{});const r=Object.assign({},ratings[did]||{},patch);
  Object.keys(r).forEach(k=>{if(r[k]===""||r[k]===false||r[k]==null)delete r[k]});
  if(Object.keys(r).length)ratings[did]=r;else delete ratings[did];
  S.me.ratings=ratings;persist("state");
}
function act(a,t){
  const id=t.dataset.id,v=activeVisit();
  switch(a){
    case "cat":UI.cat=t.dataset.v;render();break;
    case "kf":UI.kfilter=t.dataset.v;render();break;
    case "period":UI.period=t.dataset.v;render();break;
    case "rf":UI.rf=t.dataset.v;render();break;
    case "kfopen":UI.kfilter="offen";UI.cat="alle";break;
    case "smode":UI.startMode=t.dataset.v;render();break;
    case "start":{const now=Date.now(),vid="v-"+now;S.visits[vid]={id:vid,active:true,start:now,round:1,roundStart:now,rounds:{},mode:UI.startMode,note:""};persist(vid);UI.q="";UI.cat="alle";UI.vr=1;render();window.scrollTo(0,0);toast("Guten Appetit! Runde 1 läuft.");break}
    case "vr":UI.vr=+t.dataset.v;render();break;
    case "plus":{if(!v){toast("Starte zuerst ein Essen.");break}const r=UI.vr&&UI.vr<=v.round?UI.vr:v.round;const rounds=Object.assign({},v.rounds||{});rounds[r]=(rounds[r]||[]).concat([{d:id,t:Date.now()}]);v.rounds=rounds;persist(v.id);render();break}
    case "minus":{if(!v)break;const r=UI.vr&&UI.vr<=v.round?UI.vr:v.round;const arr=((v.rounds||{})[r]||[]).slice();const i=arr.map(x=>x.d).lastIndexOf(id);if(i<0)break;arr.splice(i,1);v.rounds=Object.assign({},v.rounds,{[r]:arr});persist(v.id);render();break}
    case "newround":if(!v||v.round>=MAXR)break;v.round++;v.roundStart=Date.now();UI.vr=v.round;persist(v.id);render();toast(v.round===MAXR?"Letzte Runde! 🍣":"Runde "+v.round+" läuft");break;
    case "endsheet":SHEET={type:"end"};renderOverlay();break;
    case "finish":if(!v)break;v.active=false;v.end=Date.now();v.round=Math.max(1,roundCount(v));persist(v.id);SHEET={type:"rate",vid:v.id};render();break;
    case "discard":if(!v)break;delete S.visits[v.id];persist(v.id);SHEET=null;render();toast("Essen verworfen");break;
    case "ratevisit":SHEET={type:"rate",vid:id};renderOverlay();break;
    case "rrate":{const n=+t.dataset.v;setR(id,{r:rt(id).r===n?null:n});render();break}
    case "dish":SHEET={type:"dish",id,back:SHEET&&SHEET.type==="rate"?SHEET.vid:null};renderOverlay();break;
    case "rate":{const n=+t.dataset.v;setR(SHEET.id,{r:rt(SHEET.id).r===n?null:n});render();break}
    case "mark":{const m=!rt(SHEET.id).mark;setR(SHEET.id,{mark:m});render();toast(m?"Auf die Merkliste gesetzt":"Von der Merkliste genommen");break}
    case "unmark":setR(id,{mark:false});render();break;
    case "rmphoto":delete S.photos[id];persist("ph-"+id);render();break;
    case "hide":{const d=dish(id);if((S.me.custom||[]).some(x=>x.id===id))S.me.custom=S.me.custom.filter(x=>x.id!==id);else S.me.hidden=[...new Set([...(S.me.hidden||[]),id])];persist("state");SHEET=null;render();toast(d.n+" ausgeblendet");break}
    case "unhide":S.me.hidden=[];S.me.unhidden=(S.shared.hidden||[]).slice();persist("state");render();break;
    case "adddish":SHEET={type:"add"};renderOverlay();setTimeout(()=>{const el=document.getElementById("a-name");el&&el.focus()},50);break;
    case "saveadd":{const n=document.getElementById("a-name").value.trim();if(!n){toast("Gib dem Gericht einen Namen.");break}
      const nid="x-"+Date.now().toString(36);S.me.custom=(S.me.custom||[]).concat([{id:nid,c:document.getElementById("a-cat").value,n,d:document.getElementById("a-desc").value.trim()}]);
      const num=document.getElementById("a-nr").value.trim();if(num)S.me.nums=Object.assign({},S.me.nums,{[nid]:num});
      persist("state");SHEET=null;render();toast(n+" hinzugefügt");break}
    case "edit":SHEET={type:"edit",id};renderOverlay();break;
    case "saveedit":{const g=x=>document.getElementById(x);const n=g("e-n").value.trim();if(!n){toast("Das Gericht braucht einen Namen.");break}
      saveEdit(id,{n,d:g("e-d").value.trim(),l:g("e-l").value.trim(),c:g("e-c").value,v:g("e-v").checked,s:g("e-s").checked},g("e-nr").value.trim(),UI.canShare&&g("e-share")&&g("e-share").checked);
      SHEET={type:"dish",id};render();toast("Gespeichert");break}
    case "resetedit":S.me.edits=Object.assign({},S.me.edits);delete S.me.edits[id];persist("state");SHEET={type:"dish",id};render();toast("Auf Original zurückgesetzt");break;
    case "import":SHEET={type:"import",imgs:[],text:""};renderOverlay();break;
    case "impclear":SHEET.imgs=[];renderOverlay();break;
    case "impread":impRead();break;
    case "impback":SHEET.rows=null;renderOverlay();break;
    case "impapply":impApply();break;
    case "close":{const back=SHEET&&SHEET.type==="dish"&&SHEET.back&&S.visits[SHEET.back];SHEET=back?{type:"rate",vid:SHEET.back}:null;render();break}
    case "toggle":UI.open=UI.open===id?null:id;UI.confirmDel=null;render();break;
    case "askdel":UI.confirmDel=id;render();break;
    case "nodel":UI.confirmDel=null;render();break;
    case "del":delete S.visits[id];persist(id);UI.confirmDel=null;UI.open=null;render();toast("Essen gelöscht");break;
    case "dl-stats":offer(`hokkaido-maki-meter-statistik-${today()}.csv`,statsCSV(),"Statistik (CSV)");break;
    case "dl-orders":offer(`hokkaido-maki-meter-bestellungen-${today()}.csv`,ordersCSV(),"Alle Bestellungen (CSV)");break;
    case "dl-backup":offer(`hokkaido-maki-meter-backup-${today()}.json`,JSON.stringify({app:"hokkaido-strichliste",version:3,exported:new Date().toISOString(),visits:S.visits,me:S.me,photos:S.photos}),"Backup (JSON)");break;
    case "copyout":{const ta=document.getElementById("outtext");const txt=ta.value;(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Kopiert")).catch(()=>{ta.focus();ta.select();toast("Text markiert, jetzt kopieren")});break}
  }
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||t.disabled)return;act(t.dataset.act,t)});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="photofile"&&t.files&&t.files[0]&&SHEET&&SHEET.id)photoFrom(t.files[0],SHEET.id);
  if(t.id==="importfile"&&t.files&&t.files[0])importBackup(t.files[0]);
  if(t.id==="impimgs"&&t.files&&t.files.length&&SHEET&&SHEET.type==="import"){const sh=SHEET;Promise.all([...t.files].slice(0,8).map(f=>resizeToBlob(f,1600).catch(()=>null))).then(list=>{sh.imgs=(sh.imgs||[]).concat(list.filter(Boolean)).slice(0,8);if(SHEET===sh)renderOverlay()})}
  if(t.dataset&&t.dataset.imp!=null&&SHEET&&SHEET.rows)SHEET.rows[+t.dataset.imp].on=t.checked;
});
const inT={};
document.addEventListener("input",e=>{
  const t=e.target,k=t.dataset.in;if(!k)return;
  if(k==="q"){UI.q=t.value;render();return}
  if(k==="imptext"){if(SHEET)SHEET.text=t.value;return}
  const sid=SHEET&&SHEET.id,did=t.dataset.id,val=t.value,key=k+(did||sid||"");
  clearTimeout(inT[key]);
  inT[key]=setTimeout(()=>{
    if(k==="dnote"&&sid)setR(sid,{note:val.trim()});
    else if(k==="dnr"&&sid){const nums=Object.assign({},S.me.nums);const x=val.trim();if(x)nums[sid]=x;else delete nums[sid];S.me.nums=nums;persist("state")}
    else if(k==="vnote"){const x=S.visits[did];if(x){x.note=val;persist(did)}}
    else if(k==="gnotes"){S.me.notes=val;persist("state")}
  },500);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&SHEET){SHEET=null;render()}});

/* ---------- Routing & ticking ---------- */
function route(){const t=(location.hash||"").replace("#","");UI.tab=["heute","karte","merkliste","statistik","verlauf"].includes(t)?t:"heute";SHEET=null;render()}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
setInterval(()=>{const v=activeVisit();if(!v)return;const el=document.getElementById("elapsed");if(el)el.textContent=fmtDur(Date.now()-v.start);const r=document.getElementById("roundtime");if(r)r.textContent=fmtDur(Date.now()-(v.roundStart||v.start))},20000);
let wake=null;document.addEventListener("click",async()=>{try{if(activeVisit()&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}},{passive:true});
boot();
</script>
